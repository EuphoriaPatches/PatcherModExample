plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'com.gradleup.shadow' version '9.6.1'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    shade
    implementation.extendsFrom(shade)
}

dependencies {
    // Bundle ShaderPatcher into the mod jar
    shade("com.euphoriapatches:shaderpatcher:${shaderpatcher_version}")
}

jar {
    archiveClassifier = 'slim'
    destinationDirectory = layout.buildDirectory.dir('libs')
}

shadowJar {
    dependsOn(rootProject.tasks.named('cleanLibs'))
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    archiveClassifier = ''
    configurations = [project.configurations.shade]

    // Relocate into a package unique to this mod so other mods bundling ShaderPatcher cannot conflict
    relocate 'com.euphoriapatches.shaderpatcher', "${project.group}.shadow.com.euphoriapatches.shaderpatcher"

    filesMatching('META-INF/LICENSE') {
        if (sourcePath != 'LICENSE') {
            path = 'META-INF/licenses/LICENSE-shaderpatcher.txt'
        }
    }

    // The original MIT notice of this example, bundled separately so it stays when LICENSE is replaced with another license
    from(rootProject.file('licenses/LICENSE-PatcherModExample.txt')) {
        into 'META-INF/licenses'
    }

    // Do not exclude all of META-INF, ShaderPatcher's MPL-2.0 license lives there
    exclude 'META-INF/maven/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
